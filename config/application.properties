# نمط قاعدة البيانات: sqlite للمحلات العادية والأوفلاين، postgres للسلاسل السحابية
db.mode=sqlite

# إعدادات SQLite الافتراضية
sqlite.url=jdbc:sqlite:40dash.db

# إعدادات PostgreSQL (للربط الشبكي المركزي)
postgres.url=jdbc:postgresql://localhost:5432/fortydash_db
postgres.user=postgres
postgres.password=admin

# معرّف الفرع ونقطة البيع
branch.id=BRANCH-MAIN
terminal.id=POS-01

# إعدادات الهاردوير والطابعة الحرارية المباشرة
printer.network.enabled=false
printer.network.ip=192.168.1.200
printer.network.port=9100
printer.drawer.auto_open=true